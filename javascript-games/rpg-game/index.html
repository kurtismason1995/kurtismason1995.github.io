<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rpg Game</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ribeye&display=swap" rel="stylesheet" />

    <link href="./styles/global.css" type="text/css" rel="stylesheet" />
    <link href="./styles/TextMessage.css" type="text/css" rel="stylesheet" />
    <link href="./styles/SceneTransition.css" type="text/css" rel="stylesheet" />
    <link href="./styles/KeyboardMenu.css" type="text/css" rel="stylesheet" />
    <link href="./styles/Hud.css" type="text/css" rel="stylesheet" />
    <link href="./styles/Menus.css" type="text/css" rel="stylesheet" />
    <link href="./styles/TitleScreen.css" type="text/css" rel="stylesheet" />

    <!-- Battle css -->
    <link href="./styles/Battle.css" type="text/css" rel="stylesheet" />
    <link href="./styles/Combatant.css" type="text/css" rel="stylesheet" />
    <link href="./styles/SubmissionMenu.css" type="text/css" rel="stylesheet" />
    <link href="./styles/Team.css" type="text/css" rel="stylesheet" />
  </head>
  <body>
    <div class="game-container">
      <canvas class="game-canvas" width="352" height="198"></canvas>
    </div>

    <div class="mobile-controls" aria-label="Mobile game controls">
      <div class="mobile-controls__pad" aria-label="Movement controls">
        <button type="button" class="mobile-controls__button mobile-controls__button--up" data-direction="up" aria-label="Move up">▲</button>
        <button type="button" class="mobile-controls__button mobile-controls__button--left" data-direction="left" aria-label="Move left">◀</button>
        <button type="button" class="mobile-controls__button mobile-controls__button--down" data-direction="down" aria-label="Move down">▼</button>
        <button type="button" class="mobile-controls__button mobile-controls__button--right" data-direction="right" aria-label="Move right">▶</button>
      </div>

      <div class="mobile-controls__actions" aria-label="Action controls">
        <button type="button" class="mobile-controls__button mobile-controls__button--action" data-action="confirm" aria-label="Confirm action">A</button>
        <button type="button" class="mobile-controls__button mobile-controls__button--action" data-action="cancel" aria-label="Pause or cancel">B</button>
      </div>
    </div>

    <!-- Static Content -->
    <script type="text/javascript" src="./content/animals.js"></script>
    <script type="text/javascript" src="./content/actions.js"></script>
    <script type="text/javascript" src="./content/enemies.js"></script>

    <!-- Scripts -->
    <script type="module" src="./init.js"></script>
  </body>
</html>
